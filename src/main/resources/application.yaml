spring:
  application:
    name: pw-alkt
  security:
    oauth2:
      client:
        provider:
          licensed-business:
            token-uri: ${config.licensed-business.token-uri}
          operaton:
            token-uri: ${config.operaton.token-uri}
          party:
            token-uri: ${config.party.token-uri}
          support-management:
            token-uri: ${config.support-management.token-uri}
        registration:
          licensed-business:
            authorization-grant-type: client_credentials
            provider: licensed-business
            client-id: ${config.licensed-business.client-id}
            client-secret: ${config.licensed-business.client-secret}
          operaton:
            authorization-grant-type: client_credentials
            provider: operaton
            client-id: ${config.operaton.client-id}
            client-secret: ${config.operaton.client-secret}
          party:
            authorization-grant-type: client_credentials
            provider: party
            client-id: ${config.party.client-id}
            client-secret: ${config.party.client-secret}
          support-management:
            authorization-grant-type: client_credentials
            provider: support-management
            client-id: ${config.support-management.client-id}
            client-secret: ${config.support-management.client-secret}

#----------------------------------------
# Open API
#----------------------------------------
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'

#-------------------------------------------
# Log config
#-------------------------------------------
logging:
  level:
    root: INFO

#----------------------------------------
# External task client
# Only base-url belongs to the client library. backoff.* is bound by BackoffProperties, worker.* by FailureHandler.
#----------------------------------------
camunda:
  bpm:
    client:
      base-url: ${config.operaton.base-url}
      backoff:
        initTime: 500
        factor: 2
        maxTime: 15000
  worker:
    max:
      retries: 3
    retry:
      timeout: 10000 # milliseconds

#----------------------------------------
# Process deployment
# One entry per directory. The reconciliation is deployed on its own, see README.
#----------------------------------------
process-engine:
  deployment:
    processes:
      - name: Alkt processes
        tenant: ALKT
        bpmnResourcePattern: classpath*:processmodels/*.bpmn
        dmnResourcePattern: classpath*:processmodels/*.dmn
        formResourcePattern: classpath*:processmodels/*.form
      - name: Alkt reconciliation
        tenant: ALKT
        bpmnResourcePattern: classpath*:processmodels/reconciliation/*.bpmn
        dmnResourcePattern: classpath*:processmodels/reconciliation/*.dmn
        formResourcePattern: classpath*:processmodels/reconciliation/*.form

#----------------------------------------
# Process reconciliation
# lookback: how far back in the engine history each run looks for instances that ended without a final report
#----------------------------------------
reconciliation:
  lookback: PT2H
  worker:
    enabled: true

#----------------------------------------
# Integration settings
#----------------------------------------
# Rest client
integration:
  licensed-business:
    url: ${config.licensed-business.base-url}
    connectTimeout: 5
    readTimeout: 20
  operaton:
    url: ${config.operaton.base-url}
    connectTimeout: 5
    readTimeout: 20
  party:
    url: ${config.party.base-url}
    connectTimeout: 5
    readTimeout: 20
  support-management:
    url: ${config.support-management.base-url}
    connectTimeout: 5
    readTimeout: 20

#----------------------------------------
# Circuit breakers
#----------------------------------------
resilience4j.circuitbreaker:
  instances:
    licensed-business:
      ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
    operaton:
      ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
    party:
      ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
    support-management:
      ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
