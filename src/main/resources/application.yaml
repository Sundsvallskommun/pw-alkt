spring:
  application:
    name: pw-alkt
  security:
    oauth2:
      client:
        provider:
          operaton:
            token-uri: ${config.operaton.token-uri}
          support-management:
            token-uri: ${config.support-management.token-uri}
        registration:
          operaton:
            authorization-grant-type: client_credentials
            provider: operaton
            client-id: ${config.operaton.client-id}
            client-secret: ${config.operaton.client-secret}
          support-management:
            authorization-grant-type: client_credentials
            provider: support-management
            client-id: ${config.support-management.client-id}
            client-secret: ${config.support-management.client-secret}

#----------------------------------------
# Open API
#----------------------------------------
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'

#-------------------------------------------
# Log config
#-------------------------------------------
logging:
  level:
    root: INFO

#----------------------------------------
# External task client
# The camunda-bpm external task client polls the Operaton engine, which is API compatible with Camunda 7. Its poll URL
# is the same engine the workers write to through the Operaton REST client.
#
# Not every key below belongs to the client library. Of the keys this service sets, only base-url is bound by its
# ClientProperties - as is disable-auto-fetching, which the junit profile and OpenApiSpecificationIT set to keep
# tests from polling. The library's own backoff knob is the boolean disable-backoff-strategy; it has no backoff.*
# or worker.* keys. Those two sub-trees are this service's own configuration, bound by our own classes; see the
# comment at each of them.
#----------------------------------------
camunda:
  bpm:
    client:
      base-url: ${config.operaton.base-url}
      # Bound by se.sundsvall.alkt.integration.operaton.configuration.BackoffProperties, not by the client
      # library, even though it is nested under the library's prefix. BackoffConfiguration feeds these values into
      # the @Primary ExponentialBackoffStrategy that decides how long the client waits between polls that return
      # no task.
      backoff:
        initTime: 500
        factor: 2
        maxTime: 15000
  # Also this service's own configuration, read with @Value in FailureHandler - the client library has no
  # worker.* keys of its own.
  worker:
    max:
      retries: 3
    retry:
      # Milliseconds - this is handed straight to ExternalTaskService.handleFailure(), whose retryTimeout is in
      # milliseconds. With 3 retries the task is given up on after roughly 30 seconds, which lets a transient
      # gateway or engine hiccup pass without raising an incident.
      timeout: 10000

#----------------------------------------
# Process deployment
# The resource patterns match every process model in the service, so an added schema (ansokan, anmalan, tillsyn) is
# deployed to the tenant without a configuration change.
#----------------------------------------
process-engine:
  deployment:
    processes:
      - name: Alkt processes
        tenant: ALKT
        bpmnResourcePattern: classpath*:processmodels/*.bpmn
        dmnResourcePattern: classpath*:processmodels/*.dmn
        formResourcePattern: classpath*:processmodels/*.form

#----------------------------------------
# Integration settings
#----------------------------------------
# Rest client
integration:
  operaton:
    url: ${config.operaton.base-url}
    connectTimeout: 5
    readTimeout: 20
  support-management:
    url: ${config.support-management.base-url}
    connectTimeout: 5
    readTimeout: 20

#----------------------------------------
# Circuit breakers
#----------------------------------------
resilience4j.circuitbreaker:
  instances:
    operaton:
      ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
    support-management:
      ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
