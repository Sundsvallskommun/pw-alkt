spring:
  application:
    name: pw-alkt-it
  main:
    banner-mode: "off"
reconciliation:
  worker:
    enabled: false
customer-message:
  texts:
    processing-started: "Vi har nu börjat handlägga ditt ärende. Om vi behöver mer information från dig kontaktar vi dig. Det här meddelandet är skickat automatiskt och behöver inte besvaras."
config:
  common:
    token-uri: http://localhost:${wiremock.server.port}/api-gateway/token
    client-id: the-client-id
    client-secret: the-client-secret
  licensed-business:
    base-url: http://localhost:${wiremock.server.port}/api-licensed-business
    token-uri: ${config.common.token-uri}
    client-id: ${config.common.client-id}
    client-secret: ${config.common.client-secret}
  operaton:
    base-url: http://localhost:${wiremock.server.port}/api-operaton/engine-rest
    token-uri: ${config.common.token-uri}
    client-id: ${config.common.client-id}
    client-secret: ${config.common.client-secret}
  party:
    base-url: http://localhost:${wiremock.server.port}/api-party
    token-uri: ${config.common.token-uri}
    client-id: ${config.common.client-id}
    client-secret: ${config.common.client-secret}
  party-assets:
    base-url: http://localhost:${wiremock.server.port}/api-party-assets
    token-uri: ${config.common.token-uri}
    client-id: ${config.common.client-id}
    client-secret: ${config.common.client-secret}
    relation-type: LINK
  messaging:
    base-url: http://localhost:${wiremock.server.port}/api-messaging
    token-uri: ${config.common.token-uri}
    client-id: ${config.common.client-id}
    client-secret: ${config.common.client-secret}
    slack:
      token: slack-token
      channel: slack-channel
  support-management:
    base-url: http://localhost:${wiremock.server.port}/api-support-management
    token-uri: ${config.common.token-uri}
    client-id: ${config.common.client-id}
    client-secret: ${config.common.client-secret}
  templating:
    base-url: http://localhost:${wiremock.server.port}/api-templating
    token-uri: ${config.common.token-uri}
    client-id: ${config.common.client-id}
    client-secret: ${config.common.client-secret}
